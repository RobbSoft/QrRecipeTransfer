<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrSource v1.0.10 — CSV Sender</title>
  <link rel="stylesheet" href="../shared/app-header.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a class="back-link" href="../index.html">← Startseite</a>
    <h1>QrSource<span class="app-version">v1.0.10</span></h1>
    <p class="subtitle">CSV-Datei als verschlüsselte QR-Sequenz übertragen</p>
  </header>

  <main class="layout">
    <section class="panel controls-panel">
      <label id="drop-zone" class="drop-zone" for="file-input">
        <span>CSV-Datei hier ablegen oder klicken</span>
        <input id="file-input" type="file" accept=".csv,text/csv" hidden>
      </label>

      <p id="file-info" class="file-info">Keine Datei ausgewählt</p>

      <label class="field">
        <span>Passwort</span>
        <input id="password" type="password" autocomplete="off" placeholder="Verschlüsselungspasswort">
      </label>

      <label class="field">
        <span>Geschwindigkeit: <strong id="interval-label">500 ms</strong></span>
        <input id="interval-slider" type="range" min="300" max="1000" step="50" value="500">
      </label>

      <label class="field checkbox-field">
        <input id="loop-toggle" type="checkbox" checked>
        <span>Loop aktiv</span>
      </label>

      <div class="button-row">
        <button id="btn-start" type="button">Start</button>
        <button id="btn-pause" type="button">Pause</button>
        <button id="btn-prev" type="button">Zurück</button>
        <button id="btn-next" type="button">Vor</button>
        <button id="btn-reset" type="button">Reset</button>
      </div>

      <div class="status-block">
        <p id="status-text">Keine Datei geladen</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div id="error-box" class="error-box" hidden></div>
    </section>

    <section class="panel qr-panel">
      <canvas id="qr-canvas" width="640" height="640" aria-label="Aktueller QR-Code"></canvas>
    </section>
  </main>

  <script type="module" src="app.js?v=1.0.10"></script>
</body>
</html>
